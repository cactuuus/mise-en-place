services:
  php:
    build:
      target: development
      args:
        USER_ID: ${SPIN_USER_ID}
        GROUP_ID: ${SPIN_GROUP_ID}
    ports:
      - "${APP_PORT:-80}:8080"
    volumes:
      - .:/var/www/html/
    networks:
      - development

  queue:
    build:
      target: development
      args:
        USER_ID: ${SPIN_USER_ID}
        GROUP_ID: ${SPIN_GROUP_ID}
    command: [ "php", "/var/www/html/artisan", "queue:work", "--tries=3" ]
    stop_signal: SIGTERM
    volumes:
      - .:/var/www/html/
    networks:
      - development
    healthcheck:
      test: [ "CMD", "healthcheck-queue" ]
      start_period: 10s

  node:
    image: node:20
    volumes:
      - .:/usr/src/app/
    working_dir: /usr/src/app/
    networks:
      - development

  mailpit:
    image: axllent/mailpit
    networks:
      - development
    ports:
      - "8025:8025"

networks:
  development:
