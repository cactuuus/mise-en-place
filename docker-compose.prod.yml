services:
  app:
    image: ghcr.io/redfieldchristabel/laravel:8.4-fpm-alpine-filament
    ports:
      - "${APP_PORT:-8080}:8000"  # This image likely uses port 8000
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"
      DB_CONNECTION: "${DB_CONNECTION:-sqlite}"
      DB_DATABASE: "${DB_DATABASE:-/var/www/html/.infrastructure/volume_data/sqlite/database.sqlite}"
      CACHE_STORE: "${CACHE_STORE:-file}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"
      # Performance optimizations
      PHP_OPCACHE_ENABLE: "1"
      # R2 Configuration
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY}"
      R2_DEFAULT_REGION: "${R2_DEFAULT_REGION}"
      R2_BUCKET: "${R2_BUCKET}"
      R2_ENDPOINT: "${R2_ENDPOINT}"
      R2_USE_PATH_STYLE_ENDPOINT: "${R2_USE_PATH_STYLE_ENDPOINT:-false}"
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage
      - database_sqlite:/var/www/html/.infrastructure/volume_data/sqlite
    working_dir: /var/www/html
    restart: unless-stopped
    # Initialize Laravel properly
    command: >
      sh -c "
        # Wait a moment for volumes to be ready
        sleep 2 &&

        # Ensure storage directories exist with correct permissions
        mkdir -p storage/{app,logs,framework/{cache,sessions,views}} &&
        mkdir -p .infrastructure/volume_data/sqlite &&

        # Create SQLite database if it doesn't exist
        if [ ! -f .infrastructure/volume_data/sqlite/database.sqlite ]; then
          touch .infrastructure/volume_data/sqlite/database.sqlite &&
          chmod 664 .infrastructure/volume_data/sqlite/database.sqlite
        fi &&

        # Run Laravel optimizations
        php artisan config:cache &&
        php artisan route:cache &&
        php artisan view:cache &&
        php artisan migrate --force &&
        php artisan storage:link &&

        # Start the application (adjust based on what this image expects)
        php artisan serve --host=0.0.0.0 --port=8000
      "
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/up" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  queue:
    image: ghcr.io/redfieldchristabel/laravel:8.4-fpm-alpine-filament
    command: >
      sh -c "
        sleep 15 &&
        php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --memory=512 --timeout=300
      "
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"
      DB_CONNECTION: "${DB_CONNECTION:-sqlite}"
      DB_DATABASE: "${DB_DATABASE:-/var/www/html/.infrastructure/volume_data/sqlite/database.sqlite}"
      CACHE_STORE: "${CACHE_STORE:-file}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"
      PHP_OPCACHE_ENABLE: "1"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY}"
      R2_DEFAULT_REGION: "${R2_DEFAULT_REGION}"
      R2_BUCKET: "${R2_BUCKET}"
      R2_ENDPOINT: "${R2_ENDPOINT}"
      R2_USE_PATH_STYLE_ENDPOINT: "${R2_USE_PATH_STYLE_ENDPOINT:-false}"
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage
      - database_sqlite:/var/www/html/.infrastructure/volume_data/sqlite
    working_dir: /var/www/html
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    image: ghcr.io/redfieldchristabel/laravel:8.4-fpm-alpine-filament
    command: >
      sh -c "
        sleep 20 &&
        php artisan schedule:work
      "
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"
      DB_CONNECTION: "${DB_CONNECTION:-sqlite}"
      DB_DATABASE: "${DB_DATABASE:-/var/www/html/.infrastructure/volume_data/sqlite/database.sqlite}"
      CACHE_STORE: "${CACHE_STORE:-file}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"
      PHP_OPCACHE_ENABLE: "1"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY}"
      R2_DEFAULT_REGION: "${R2_DEFAULT_REGION}"
      R2_BUCKET: "${R2_BUCKET}"
      R2_ENDPOINT: "${R2_ENDPOINT}"
      R2_USE_PATH_STYLE_ENDPOINT: "${R2_USE_PATH_STYLE_ENDPOINT:-false}"
    volumes:
      - ./:/var/www/html
      - storage_data:/var/www/html/storage
      - database_sqlite:/var/www/html/.infrastructure/volume_data/sqlite
    working_dir: /var/www/html
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

volumes:
  storage_data:
    driver: local
  database_sqlite:
    driver: local
