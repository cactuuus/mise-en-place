services:
  app:
    image: serversideup/php:8.4-fpm-nginx
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"
      DB_CONNECTION: "${DB_CONNECTION:-sqlite}"
      DB_DATABASE: "${DB_DATABASE:-/var/www/html/.infrastructure/volume_data/sqlite/database.sqlite}"
      CACHE_STORE: "${CACHE_STORE:-file}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"
      # Performance optimizations
      PHP_OPCACHE_ENABLE: "1"
      AUTORUN_ENABLED: "true"
      AUTORUN_COMPOSER_INSTALL: "true"
      AUTORUN_LARAVEL_CONFIG_CACHE: "true"
      AUTORUN_LARAVEL_ROUTE_CACHE: "true"
      AUTORUN_LARAVEL_VIEW_CACHE: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_STORAGE_LINK: "true"
      # R2 Configuration
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY}"
      R2_DEFAULT_REGION: "${R2_DEFAULT_REGION}"
      R2_BUCKET: "${R2_BUCKET}"
      R2_ENDPOINT: "${R2_ENDPOINT}"
      R2_USE_PATH_STYLE_ENDPOINT: "${R2_USE_PATH_STYLE_ENDPOINT:-false}"
    volumes:
      - ./:/var/www/html
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
      - storage_framework:/var/www/html/storage/framework
      - database_sqlite:/var/www/html/.infrastructure/volume_data/sqlite
    working_dir: /var/www/html
    user: "33:33"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80/up" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  queue:
    image: serversideup/php:8.4-fpm-nginx
    command: [ "php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600", "--memory=512", "--timeout=300" ]
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"
      DB_CONNECTION: "${DB_CONNECTION:-sqlite}"
      DB_DATABASE: "${DB_DATABASE:-/var/www/html/.infrastructure/volume_data/sqlite/database.sqlite}"
      CACHE_STORE: "${CACHE_STORE:-file}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"
      PHP_OPCACHE_ENABLE: "1"
      AUTORUN_ENABLED: "true"
      AUTORUN_COMPOSER_INSTALL: "true"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY}"
      R2_DEFAULT_REGION: "${R2_DEFAULT_REGION}"
      R2_BUCKET: "${R2_BUCKET}"
      R2_ENDPOINT: "${R2_ENDPOINT}"
      R2_USE_PATH_STYLE_ENDPOINT: "${R2_USE_PATH_STYLE_ENDPOINT:-false}"
    volumes:
      - ./:/var/www/html
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
      - storage_framework:/var/www/html/storage/framework
      - database_sqlite:/var/www/html/.infrastructure/volume_data/sqlite
    working_dir: /var/www/html
    user: "33:33"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    image: serversideup/php:8.4-fpm-nginx
    command: [ "php", "artisan", "schedule:work" ]
    environment:
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL}"
      DB_CONNECTION: "${DB_CONNECTION:-sqlite}"
      DB_DATABASE: "${DB_DATABASE:-/var/www/html/.infrastructure/volume_data/sqlite/database.sqlite}"
      CACHE_STORE: "${CACHE_STORE:-file}"
      SESSION_DRIVER: "${SESSION_DRIVER:-database}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      FILESYSTEM_DISK: "${FILESYSTEM_DISK:-local}"
      PHP_OPCACHE_ENABLE: "1"
      AUTORUN_ENABLED: "true"
      AUTORUN_COMPOSER_INSTALL: "true"
      R2_ACCESS_KEY_ID: "${R2_ACCESS_KEY_ID}"
      R2_SECRET_ACCESS_KEY: "${R2_SECRET_ACCESS_KEY}"
      R2_DEFAULT_REGION: "${R2_DEFAULT_REGION}"
      R2_BUCKET: "${R2_BUCKET}"
      R2_ENDPOINT: "${R2_ENDPOINT}"
      R2_USE_PATH_STYLE_ENDPOINT: "${R2_USE_PATH_STYLE_ENDPOINT:-false}"
    volumes:
      - ./:/var/www/html
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
      - storage_framework:/var/www/html/storage/framework
      - database_sqlite:/var/www/html/.infrastructure/volume_data/sqlite
    working_dir: /var/www/html
    user: "33:33"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

volumes:
  storage_app:
    driver: local
  storage_logs:
    driver: local
  storage_framework:
    driver: local
  database_sqlite:
    driver: local
