[phases.setup]
nixPkgs = ['...', 'php84', 'php84Packages.composer', 'nodejs_20', 'sqlite']

[phases.install]
cmds = [
    'composer install --no-dev --optimize-autoloader',
    'npm ci',
    'npm run build'
]

[phases.build]
cmds = [
    'touch database/database.sqlite',
    'chmod -R 775 storage bootstrap/cache',
    'php artisan config:cache',
    'php artisan route:cache',
    'php artisan view:cache'
]

[start]
cmd = 'php artisan migrate --force && (php artisan schedule:work &) && php artisan serve --host=0.0.0.0 --port=8000'
