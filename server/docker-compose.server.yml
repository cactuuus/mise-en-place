services:
  app:
    image: ghcr.io/${GITHUB_USERNAME}/mise-${APP_ENV}:latest
    container_name: mise-${APP_ENV}-fpm
    restart: unless-stopped
    user: www-data
    env_file: .env
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public
    networks:
      - web_proxy
      - shared_db_network

  nginx:
    image: nginx:alpine
    container_name: mise-${APP_ENV}-nginx
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public
    networks:
      - web_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mise-${APP_ENV}-router.rule=Host(`new-${APP_DOMAIN}`)"
      - "traefik.http.routers.mise-${APP_ENV}-router.entrypoints=websecure"

  worker:
    image: ghcr.io/${GITHUB_USERNAME}/mise-${APP_ENV}:latest
    container_name: mise-${APP_ENV}-worker
    restart: unless-stopped
    user: www-data
    depends_on:
      - app
    command: php artisan queue:work --verbose --tries=3 --timeout=90
    env_file: .env
    volumes:
      - app_storage:/var/www/html/storage
      - app_public:/var/www/html/public
    networks:
      - shared_db_network

networks:
  web_proxy:
    external: true
  shared_db_network:
    external: true

volumes:
  app_storage:
  app_public:
